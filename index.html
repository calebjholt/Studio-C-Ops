.sc-root.dark{--bg:#141619;--panel:#1d1f23;--ink:#ececeb;--muted:#83837f;--muted2:#a8a8a4;--line:#2a2d31;--line2:#33363b;--hover:#26282d;--active:#2d3035;--green-bg:#193024;--green:#5cd08a;--red-bg:#361f1c;--red:#ef8a74;--blue-bg:#1b2740;--blue:#7aa2ec;--amber-bg:#33291a;--amber:#e0a54a;}
.sc-root.dark .sc-btn{background:#ececeb;color:#16181b;} .sc-root.dark .sc-btn:hover{background:#fff;}
.sc-root.dark .sc-stagepill.on{background:#ececeb;color:#16181b;border-color:#ececeb;}
.sc-root.dark .sc-stripcard.blend{background:#19241d;border-color:#2b3a2f;}
*{box-sizing:border-box}
.sc-root{display:flex;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
.sc-num{font-variant-numeric:tabular-nums;} button{font-family:inherit;}
.sc-side{width:236px;flex-shrink:0;display:flex;flex-direction:column;padding:14px 12px;}
.sc-orgsel{display:flex;align-items:center;gap:9px;width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:7px 10px;cursor:pointer;margin-bottom:18px;}
.sc-orgmark{width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sc-orgname{font-weight:600;font-size:14.5px;flex:1;text-align:left;} .sc-orgchev{color:var(--muted);}
.sc-nav{display:flex;flex-direction:column;gap:1px;flex:1;}
.sc-navgroup{font-size:11px;font-weight:500;color:var(--muted);padding:16px 10px 6px;}
.sc-navitem{display:flex;align-items:center;gap:10px;width:100%;background:none;border:1px solid transparent;color:var(--muted2);font-size:13.5px;font-weight:500;padding:8px 10px;border-radius:8px;cursor:pointer;transition:all .13s;}
.sc-navitem:hover{background:var(--hover);color:var(--ink);} .sc-navitem.on{background:var(--panel);border-color:var(--line2);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.sc-navic{opacity:.85;} .sc-navlabel{flex:1;text-align:left;}
.sc-navbadge{font-size:11px;font-weight:500;color:var(--muted);background:var(--bg);border:1px solid var(--line2);padding:1px 6px;border-radius:6px;}
.sc-side-foot{display:flex;flex-direction:column;gap:8px;padding-top:12px;}
.sc-sampleflag{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--amber);background:var(--amber-bg);padding:4px 8px;border-radius:6px;text-align:center;}
.sc-foot-actions{display:flex;gap:6px;}
.sc-ghost{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--panel);border:1px solid var(--line2);color:var(--muted2);font-size:12px;font-weight:500;padding:7px;border-radius:8px;cursor:pointer;}
.sc-ghost:hover{color:var(--ink);background:var(--hover);} .sc-ghost.danger{flex:0 0 auto;width:34px;} .sc-ghost.danger:hover{color:var(--red);border-color:var(--red-bg);background:var(--red-bg);}
.sc-user{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:7px 9px;}
.sc-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#2e7d45,#181818);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.sc-user-name{flex:1;font-weight:600;font-size:13px;} .sc-muted-ic{color:var(--muted);cursor:pointer;}
.sc-main{flex:1;margin:8px 8px 8px 0;background:var(--panel);border:1px solid var(--line2);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.sc-topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);}
.sc-topbar-title{font-weight:600;font-size:15px;} .sc-topbar-actions{display:flex;gap:6px;}
.sc-icbtn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--line2);border-radius:9px;color:var(--muted2);cursor:pointer;} .sc-icbtn:hover{background:var(--hover);color:var(--ink);}
.sc-scroll{flex:1;overflow-y:auto;} .sc-page{padding:26px 28px 60px;max-width:1240px;}
.sc-h1{font-weight:700;font-size:23px;letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:10px;}
.sc-muted{color:var(--muted2);} .sc-muted-sm{color:var(--muted);font-size:12.5px;} .mb{margin-bottom:14px;} .sc-green{color:var(--green);}
.sc-section-h{font-weight:700;font-size:17px;letter-spacing:-.01em;margin:30px 0 12px;}
.sc-back{display:inline-flex;align-items:center;gap:3px;background:none;border:none;color:var(--muted2);font-size:13px;font-weight:500;cursor:pointer;padding:0 0 14px;margin-left:-2px;} .sc-back:hover{color:var(--ink);}
.sc-detail-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;}
.sc-card{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:20px;}
.sc-card-label{font-size:13px;font-weight:500;color:var(--muted2);}
.sc-two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;align-items:start;}
.sc-colstack{display:flex;flex-direction:column;gap:14px;}
.sc-cardcollapse{display:flex;align-items:center;gap:8px;background:none;border:none;padding:0;cursor:pointer;font-family:inherit;width:100%;text-align:left;}
.sc-cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.sc-exp{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;} .sc-exp:last-of-type{border-bottom:none;}
.sc-exp.invoiced{opacity:.55;}
.sc-exp-name{font-weight:500;flex:1;min-width:0;} .sc-exp-qty{color:var(--muted2);font-size:11.5px;white-space:nowrap;} .sc-exp-line{min-width:56px;text-align:right;}
.sc-exp-tag{font-size:10px;font-weight:600;color:var(--muted2);background:var(--bg);border:1px solid var(--line2);padding:2px 7px;border-radius:20px;}
.sc-billchk{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted2);background:var(--bg);border:1px solid var(--line2);border-radius:20px;padding:2px 8px 2px 6px;cursor:pointer;}
.sc-billchk.on{background:var(--green-bg);border-color:var(--green-bg);color:var(--green);}
.sc-exp-total{display:flex;justify-content:space-between;align-items:center;padding:10px 0 4px;font-size:12.5px;font-weight:600;color:var(--muted2);border-top:1px solid var(--line);margin-top:4px;}
.sc-expadd{display:flex;gap:6px;align-items:center;margin-top:12px;flex-wrap:wrap;}
.sc-expadd input[type=text]{flex:1;min-width:90px;} .sc-expadd input[type=number]{width:64px;}
.sc-expadd input{padding:7px 9px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);color:var(--ink);font-family:inherit;font-size:12.5px;}
.sc-expbill{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted2);white-space:nowrap;cursor:pointer;}
.sc-cardadd{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--muted2);cursor:pointer;flex-shrink:0;}
.sc-cardadd:hover{background:var(--hover);color:var(--ink);}
.sc-pay.click{cursor:pointer;border-radius:8px;margin:0 -6px;padding-left:6px;padding-right:6px;}
.sc-pay.click:hover{background:var(--hover);}
.sc-invtime{display:grid;grid-template-columns:auto 70px 1fr auto;gap:8px;align-items:center;padding:5px 0;}
.sc-invtime input{font-size:12.5px;padding:5px 7px;border:1px solid var(--line2);border-radius:7px;background:var(--panel);color:var(--ink);font-family:inherit;width:100%;}
.sc-del-btn{color:var(--red);border-color:var(--line2);white-space:nowrap;}
.sc-delrow{display:flex;justify-content:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
.sc-dellink{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--red);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;} .sc-dellink:hover{text-decoration:underline;}
@media(max-width:900px){.sc-two,.sc-dash-grid{grid-template-columns:1fr!important;}.sc-side{width:60px;}.sc-orgname,.sc-navlabel,.sc-navgroup,.sc-navbadge,.sc-user-name,.sc-sampleflag,.sc-foot-actions{display:none;}}
@media(max-width:640px){
  .sc-tcol{flex-basis:82vw;max-width:82vw;}
  .sc-tasktoolbar{justify-content:space-between;}
  .sc-side{position:fixed;bottom:0;left:0;right:0;width:100%!important;flex-direction:row;align-items:stretch;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));margin:0;background:var(--panel);border-top:1px solid var(--line2);box-shadow:0 -2px 14px rgba(0,0,0,.06);z-index:60;}
  .sc-orgsel,.sc-side-foot{display:none!important;}
  .sc-nav{flex-direction:row;justify-content:space-around;gap:2px;flex:1;}
  .sc-navgroup{display:none;}
  .sc-navitem{flex:1;flex-direction:column;justify-content:center;gap:3px;padding:8px 3px;border:none;min-height:50px;border-radius:10px;font-size:10px;font-weight:600;position:relative;}
  .sc-navitem.on{background:var(--hover);box-shadow:none;}
  .sc-main{margin:0;border:none;border-radius:0;}
  .sc-topbar{padding:12px 15px;}
  .sc-page{padding:16px 13px calc(94px + env(safe-area-inset-bottom,0px));max-width:100%;}
  .sc-dash-grid,.sc-two{grid-template-columns:1fr!important;}
  .sc-statrow{grid-template-columns:repeat(2,1fr)!important;}
  .sc-reportgrid{grid-template-columns:repeat(2,1fr)!important;}
  .sc-hero-num{font-size:30px;}
  .sc-board{flex-direction:column;overflow-x:visible;}
  .sc-col{flex:none;width:100%;min-width:0;border-left:none;border-top:1px solid var(--line);padding:14px 0 4px;}
  .sc-col:first-child{border-top:none;padding-top:0;}
  .sc-strip{flex-wrap:wrap;overflow-x:visible;}
  .sc-stripcard{flex:1 1 calc(50% - 6px);min-width:0;}
  .sc-tablecard{overflow-x:visible;background:none!important;border:none!important;padding:0!important;}
  .sc-table{min-width:0;}
  .sc-table thead{display:none;}
  .sc-table tbody{display:block;}
  .sc-table tr{display:block;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:9px 13px;margin-bottom:10px;}
  .sc-table td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 0;border:none!important;text-align:right;white-space:normal;}
  .sc-table td::before{content:attr(data-label);color:var(--muted2);font-weight:500;text-align:left;flex-shrink:0;white-space:nowrap;}
  .sc-table td:empty{display:none;}
  .sc-table td:first-child{justify-content:flex-start;font-weight:600;font-size:14px;border-bottom:1px solid var(--line)!important;padding-bottom:8px;margin-bottom:3px;}
  .sc-table td:first-child::before{display:none;}
  .sc-modal{max-width:94vw;padding:22px;}
  .sc-overlay{z-index:200;}
  .sc-detail-head,.sc-head-right,.sc-listhead{flex-wrap:wrap;}
}
.sc-dash-grid{display:grid;grid-template-columns:1fr 300px;gap:14px;}
.sc-hero-head{display:flex;justify-content:space-between;align-items:center;}
.sc-hero-row{display:flex;align-items:center;gap:12px;margin-top:10px;}
.sc-hero-num{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1;}
.sc-delta{display:inline-flex;align-items:center;gap:2px;font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:20px;}
.sc-delta.up{background:var(--green-bg);color:var(--green);} .sc-delta.down{background:var(--red-bg);color:var(--red);}
.sc-hero-sub{color:var(--muted);font-size:13px;margin-top:8px;}
.sc-stack{display:flex;flex-direction:column;gap:14px;} .sc-mini{padding:16px 18px;} .sc-mini-val{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:8px;} .sc-mini-val.green{color:var(--green);} .sc-mini-val.amber{color:var(--amber);}
.sc-statrow{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px;} .sc-statrow.two{grid-template-columns:repeat(2,1fr);} .sc-statrow.three{grid-template-columns:repeat(3,1fr);} .sc-statrow.four{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.sc-statrow{grid-template-columns:repeat(2,1fr)!important;}}
.sc-big{padding:16px 18px;} .sc-big-val{font-size:25px;font-weight:700;letter-spacing:-.02em;margin-top:9px;} .sc-big-val.green{color:var(--green);} .sc-big-val.amber{color:var(--amber);} .sc-big-val.grey{color:var(--muted2);}
.sc-clickable{cursor:pointer;transition:border-color .12s;} .sc-clickable:hover{border-color:var(--ink);}
.sc-viewlink{float:right;font-size:11px;font-weight:600;color:var(--muted);} .sc-clickable:hover .sc-viewlink{color:var(--ink);}
.sc-strip{display:flex;gap:12px;flex-wrap:wrap;} .sc-stripcard{flex:1;min-width:150px;padding:15px 17px;} .sc-stripcard.blend{background:#f3f7f4;border-color:#d9e8dd;} .sc-strip-rate{font-size:23px;font-weight:700;letter-spacing:-.02em;margin:7px 0 3px;}
.sc-seg{display:inline-flex;background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:3px;gap:2px;}
.sc-reportgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:6px;} @media(max-width:1100px){.sc-reportgrid{grid-template-columns:repeat(3,1fr);}} @media(max-width:700px){.sc-reportgrid{grid-template-columns:repeat(2,1fr);}}
.sc-seg button,.sc-seg select{background:none;border:none;font-size:12.5px;font-weight:500;color:var(--muted2);padding:5px 11px;border-radius:6px;cursor:pointer;text-transform:capitalize;}
.sc-seg button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06);} .sc-seg.sm button,.sc-seg.sm select{padding:4px 9px;font-size:12px;}
.sc-tabbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
.sc-tabs{display:flex;gap:4px;flex-wrap:wrap;}
.sc-tab{display:flex;align-items:center;gap:7px;background:none;border:none;font-size:14px;font-weight:500;color:var(--muted2);padding:7px 12px;border-radius:9px;cursor:pointer;} .sc-tab:hover{background:var(--hover);} .sc-tab.on{background:var(--active);color:var(--ink);font-weight:600;}
.sc-count{font-size:11px;font-weight:600;background:var(--panel);border:1px solid var(--line2);color:var(--muted2);padding:0 6px;border-radius:20px;min-width:18px;text-align:center;}
.sc-btn{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border:none;font-weight:600;font-size:13px;padding:8px 14px;border-radius:9px;cursor:pointer;} .sc-btn:hover{background:#000;} .sc-btn:disabled{opacity:.4;cursor:not-allowed;}
.sc-btn.sm{padding:6px 11px;font-size:12px;} .sc-btn.full{width:100%;justify-content:center;padding:11px;margin-top:8px;}
.sc-danger-btn{background:var(--red);} .sc-danger-btn:hover{background:#a5361f;}
.sc-btn-outline{display:inline-flex;align-items:center;gap:6px;background:var(--panel);color:var(--ink);border:1px solid var(--line2);font-weight:600;font-size:13px;padding:7px 13px;border-radius:9px;cursor:pointer;} .sc-btn-outline:hover{background:var(--hover);} .sc-btn-outline.sm{padding:5px 10px;font-size:12px;} .sc-btn-outline.full{width:100%;justify-content:center;padding:10px;margin-top:8px;}
.sc-tablecard{padding:6px 8px;} .sc-table{width:100%;border-collapse:collapse;}
.sc-table th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);}
.sc-table th.r,.sc-table td.r{text-align:right;} .sc-table td{padding:14px;border-bottom:1px solid var(--line);font-size:13.5px;} .sc-table tr:last-child td{border-bottom:none;}
.sc-td-strong{font-weight:600;} .sc-td-empty{text-align:center;color:var(--muted);padding:26px!important;} .sc-clickrow{cursor:pointer;} .sc-clickrow:hover td{background:var(--hover);} .sc-cname{margin-right:9px;}
.sc-pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;text-transform:capitalize;}
.sc-pill.green{background:var(--green-bg);color:var(--green);} .sc-pill.amber{background:var(--amber-bg);color:var(--amber);} .sc-pill.red{background:var(--red-bg);color:var(--red);} .sc-pill.blue{background:var(--blue-bg);color:var(--blue);} .sc-pill.gray{background:var(--active);color:var(--muted2);}
.sc-statustag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;vertical-align:middle;}
.sc-statustag.active{background:#bdecc6;color:#111;} .sc-statustag.inactive{background:#9b9b98;color:#fff;}
.sc-tagtoggle{display:inline-flex;justify-content:flex-start;align-items:center;min-width:92px;background:none;border:none;padding:0;cursor:pointer;font-family:inherit;vertical-align:middle;}
.sc-tt-idle,.sc-tt-hover{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;}
.sc-tt-idle.active,.sc-tt-hover.active{background:#bdecc6;color:#111;} .sc-tt-idle.inactive,.sc-tt-hover.inactive{background:#9b9b98;color:#fff;}
.sc-tt-hover{display:none;} .sc-tagtoggle:hover .sc-tt-idle{display:none;} .sc-tagtoggle:hover .sc-tt-hover{display:inline-block;}
.sc-sortselect{font-size:12.5px;font-weight:500;color:var(--muted2);background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;cursor:pointer;}
.sc-listhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.sc-listhead-l{display:flex;align-items:center;gap:9px;} .sc-listhead-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sc-listtitle{font-weight:700;font-size:17px;letter-spacing:-.01em;}
.sc-collapse{display:flex;align-items:center;gap:9px;background:none;border:none;cursor:pointer;padding:0;color:var(--ink);font-family:inherit;}
.sc-collapse:hover .sc-listtitle{color:var(--muted2);} .sc-tri{font-size:12px;color:var(--muted);width:14px;text-align:center;}
.sc-inprog{color:var(--green);font-weight:600;font-size:12.5px;}
.sc-pipeforecast{display:flex;align-items:baseline;gap:7px;white-space:nowrap;}
.sc-pf-label{font-size:12.5px;font-weight:500;color:var(--muted);} .sc-pf-val{font-size:12.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;}
.sc-paytoggle{display:inline-flex;justify-content:flex-end;align-items:center;min-width:100px;background:none;border:none;padding:0;cursor:pointer;font-family:inherit;}
.sc-pt-idle{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--amber-bg);color:var(--amber);white-space:nowrap;}
.sc-pt-hover{display:none;align-items:center;gap:3px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--green);color:#fff;white-space:nowrap;}
.sc-paytoggle:hover .sc-pt-idle{display:none;} .sc-paytoggle:hover .sc-pt-hover{display:inline-flex;}
.sc-label-light{color:var(--muted);font-weight:400;}
.sc-mini-dual{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:8px;display:flex;align-items:baseline;gap:8px;}
.sc-dual-sep{color:var(--muted);font-weight:500;} .sc-dual-out{color:var(--amber);}
/* pipeline board: no col fill/border, 1px dividers */
.sc-board{display:flex;align-items:flex-start;overflow-x:auto;}
.sc-col{flex:1 1 0;min-width:212px;padding:0 16px;border-left:1px solid var(--line);}
.sc-col:first-child{border-left:none;padding-left:0;}
.sc-col-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:2px 0;}
.sc-col-name{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;} .sc-dot{width:8px;height:8px;border-radius:50%;}
.sc-col-val{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;} .sc-col-empty{color:var(--muted);font-size:12.5px;text-align:center;padding:16px 0;}
